[package]
name = "fractional-nft-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"
contract-events = { path = "../contract_events" }
commit-reveal-rng = { path = "../commit_reveal_rng" }

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
proptest = "1"
