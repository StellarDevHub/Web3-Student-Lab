# Prometheus alerting rules for Web3 Student Lab SLOs (BE-050, #1622).
#
# Metric sources (backend/src/metrics):
#   w3sl_http_responses_total{status_class}                 MetricsExporter
#   w3sl_http_request_duration_milliseconds_bucket{le}      MetricsCollector histogram
#   w3sl_db_pool_utilization_percent                        dbPoolMetrics (set by DB health check)
#   w3sl_external_probe_total{probe,outcome}                deepReadiness probe outcomes
#
# Noise control: each ratio alert also requires a minimum request rate so a
# quiet service does not page on one failed request, and a `for:` duration so a
# single bad evaluation does not fire. Evaluation interval is 15s, so an alert
# fires roughly 45-60s after a sustained breach.

groups:
  - name: web3-student-lab-slo
    interval: 15s
    rules:
      - alert: ApiErrorRateHigh
        expr: |
          (
            sum(rate(w3sl_http_responses_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(w3sl_http_responses_total[5m])), 1e-9)
          ) > 0.01
          and sum(rate(w3sl_http_responses_total[5m])) > 0.1
        for: 30s
        labels:
          severity: critical
          service: backend
          slo: api-error-rate
        annotations:
          summary: "API 5xx error rate above 1% for 30s"
          description: "5xx responses are {{ $value | humanizePercentage }} of all responses over the last 5m."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#apierrorratehigh"
          diagnostic_query: 'sum by (status_class) (rate(w3sl_http_responses_total[5m]))'

      - alert: ApiP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(w3sl_http_request_duration_milliseconds_bucket[5m]))
          ) > 1500
          and sum(rate(w3sl_http_request_duration_milliseconds_count[5m])) > 0.1
        for: 1m
        labels:
          severity: warning
          service: backend
          slo: api-p95-latency
        annotations:
          summary: "API p95 response time above 1500 ms"
          description: "p95 latency is {{ $value | humanize }} ms over the last 5m."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#apip95latencyhigh"
          diagnostic_query: 'histogram_quantile(0.95, sum by (le) (rate(w3sl_http_request_duration_milliseconds_bucket[5m])))'

      - alert: DbPoolUtilizationHigh
        expr: w3sl_db_pool_utilization_percent > 85
        for: 30s
        labels:
          severity: critical
          service: database
          slo: db-pool-utilization
        annotations:
          summary: "Database connection pool above 85% utilisation"
          description: "Pool utilisation is {{ $value }}% of DB_POOL_MAX (last health check)."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#dbpoolutilizationhigh"
          diagnostic_query: 'w3sl_db_pool_utilization_percent'

      - alert: RpcProbeFailureRateHigh
        expr: |
          (
            sum(rate(w3sl_external_probe_total{probe="horizon_ledger",outcome="failed"}[5m]))
            /
            clamp_min(sum(rate(w3sl_external_probe_total{probe="horizon_ledger"}[5m])), 1e-9)
          ) > 0.05
          and sum(rate(w3sl_external_probe_total{probe="horizon_ledger"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
          service: stellar-rpc
          slo: rpc-failure-rate
        annotations:
          summary: "Stellar RPC readiness probe failing more than 5% of the time"
          description: "Probe failure ratio is {{ $value | humanizePercentage }} over the last 5m."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#rpcprobefailureratehigh"
          diagnostic_query: 'sum by (outcome) (rate(w3sl_external_probe_total{probe="horizon_ledger"}[5m]))'

  # BE-077 — custom Prometheus exporter (/metrics, src/metrics/prometheusMetrics.ts).
  # Queue depth and indexer lag are the two saturation signals that the
  # request-level SLO alerts above cannot see.
  - name: web3-student-lab-prometheus-exporter
    interval: 15s
    rules:
      - alert: SorobanIndexerLagHigh
        # `soroban_indexer_ledger_lag_seconds` is lag in seconds; with a ~5s
        # ledger close time, 3 ledgers is 15s.
        expr: soroban_indexer_ledger_lag_seconds > 15
        for: 2m
        labels:
          severity: critical
          service: soroban-indexer
          slo: indexer-lag
        annotations:
          summary: "Soroban indexer is more than 3 ledgers behind the network"
          description: "Indexer {{ $labels.indexer }} is {{ $value | humanizeDuration }} behind the network head (threshold: 3 ledgers ≈ 15s)."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#sorobanindexerlaghigh"
          diagnostic_query: 'soroban_indexer_ledger_lag_seconds'

      - alert: BullmqQueueDepthHigh
        expr: sum by (queue) (bullmq_queue_waiting_jobs_count) > 500
        for: 5m
        labels:
          severity: warning
          service: background-workers
          slo: queue-saturation
        annotations:
          summary: "BullMQ queue {{ $labels.queue }} has more than 500 waiting jobs"
          description: "Queue {{ $labels.queue }} has {{ $value | humanize }} waiting jobs; worker capacity is saturated."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#bullmqqueuedepthhigh"
          diagnostic_query: 'sum by (queue) (bullmq_queue_waiting_jobs_count)'

      - alert: BullmqQueueDepthCritical
        expr: sum by (queue) (bullmq_queue_waiting_jobs_count) > 2000
        for: 5m
        labels:
          severity: critical
          service: background-workers
          slo: queue-saturation
        annotations:
          summary: "BullMQ queue {{ $labels.queue }} backlog is critical"
          description: "Queue {{ $labels.queue }} has {{ $value | humanize }} waiting jobs; user-facing work is at risk."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#bullmqqueuedepthhigh"
          diagnostic_query: 'sum by (queue) (bullmq_queue_waiting_jobs_count)'

      - alert: WasmEvaluationLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(wasm_evaluation_duration_seconds_bucket[5m]))
          ) > 1.5
          and sum(rate(wasm_evaluation_duration_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: wasm-sandbox
          slo: evaluation-latency
        annotations:
          summary: "Sandboxed WASM evaluation p95 above 1.5s"
          description: "p95 evaluation duration is {{ $value | humanizeDuration }} over the last 5m; grading throughput is degrading."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#wasmevaluationlatencyhigh"
          diagnostic_query: 'histogram_quantile(0.95, sum by (le) (rate(wasm_evaluation_duration_seconds_bucket[5m])))'

      - alert: MetricsScrapeTargetDown
        expr: up{job="web3-student-lab-backend"} == 0
        for: 5m
        labels:
          severity: warning
          service: backend
          slo: observability
        annotations:
          summary: "Prometheus cannot scrape the backend /metrics endpoint"
          description: "The {{ $labels.instance }} scrape target has been down for 5m; metrics, dashboards and alerts are blind."
          runbook_url: "https://github.com/StellarDevHub/Web3-Student-Lab/blob/main/monitoring/runbooks.md#metricsscrapetargetdown"
          diagnostic_query: 'up{job="web3-student-lab-backend"}'
