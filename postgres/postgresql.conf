# =============================================================================
# PostgreSQL 15 Production Configuration (BE-080)
# Automated Vacuum, Deadlock Monitoring, Slow Query Logging & PgBouncer Sizing
# =============================================================================

# -----------------------------------------------------------------------------
# Connections & PgBouncer Sizing
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
# Sized for PgBouncer transaction pooling (max_db_connections = 100 + admin/migrations)
max_connections = 200
superuser_reserved_connections = 5

# -----------------------------------------------------------------------------
# Automated Vacuum (Non-Blocking Dead-Tuple Cleanup)
# -----------------------------------------------------------------------------
# Autovacuum acquires only SHARE UPDATE EXCLUSIVE locks, allowing concurrent
# user-facing SELECT/INSERT/UPDATE/DELETE queries without blocking.
autovacuum = on
track_counts = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
# Throttle I/O so autovacuum never starves user-facing read/write queries
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000
log_autovacuum_min_duration = 1000ms

# -----------------------------------------------------------------------------
# Slow Query Logging (> 250ms)
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
# Automatically log all queries taking longer than 250ms
log_min_duration_statement = 250
log_line_prefix = '%m [%p] %q%u@%d '
log_duration = off
log_checkpoints = on
log_temp_files = 0

# -----------------------------------------------------------------------------
# Deadlock Detection & Lock Wait Monitoring
# -----------------------------------------------------------------------------
deadlock_timeout = 1s
log_lock_waits = on
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s
