# BE-089 | Secret & Credential Leak Detection
#
# Runs Gitleaks on every pull request and every push to `main` to detect
# accidentally committed secrets: private keys, API tokens, passwords,
# connection strings, seed phrases, and similar credentials.
#
# Configuration lives in .gitleaks.toml at the repository root.
# The job is NOT `continue-on-error`; a finding hard-blocks merge.

name: Secret Scan (Gitleaks)

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  # Allow manual triggering for ad-hoc audits.
  workflow_dispatch:

# Read-only: Gitleaks only inspects the checked-out source tree.
permissions:
  contents: read
  # Write access to the Security tab so Gitleaks SARIF is surfaced there.
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks secret detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Full clone so Gitleaks can inspect the complete commit history,
          # not just the HEAD snapshot. This catches secrets that were added
          # and "deleted" in a later commit but are still in git history.
          fetch-depth: 0
          persist-credentials: false

      # -----------------------------------------------------------------------
      # For pull requests, Gitleaks compares only the commits in the PR branch
      # against the base branch rather than re-scanning the entire history.
      # For pushes to main it scans the diff introduced by the push.
      # -----------------------------------------------------------------------
      - name: Run Gitleaks (PR diff)
        if: github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for org-level repos on the paid plan.
          # Leave unset for public repos and personal accounts.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          # Scan only the commits added in this PR.
          args: >-
            detect
            --config=.gitleaks.toml
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            --report-format=sarif
            --report-path=gitleaks-report.sarif
            --exit-code=1
            --verbose

      - name: Run Gitleaks (push / full scan)
        if: github.event_name != 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: >-
            detect
            --config=.gitleaks.toml
            --report-format=sarif
            --report-path=gitleaks-report.sarif
            --exit-code=1
            --verbose

      - name: Upload Gitleaks SARIF to GitHub Security tab
        # Upload findings even on failure so the Security tab lists them.
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
        continue-on-error: true
