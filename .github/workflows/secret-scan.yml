name: Secret Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only by default; write permission required only for SARIF upload.
permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history is required so gitleaks can walk the entire commit
          # range introduced by the PR rather than only the tip snapshot.
          fetch-depth: 0
          persist-credentials: false

      # Install the gitleaks CLI directly so we can pass --config,
      # --gitleaks-ignore-path, --log-opts, and --report-format explicitly.
      # The gitleaks/gitleaks-action@v2 wrapper does not expose these inputs.
      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      # PR scan: only examine commits introduced by this PR so reviewers get a
      # focused finding list rather than historical noise from the full history.
      - name: Run Gitleaks (PR diff scan)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-pr.sarif
        # Non-zero exit code when secrets are found — this blocks the PR.

      # Push scan: scan the full repository tree on every branch push.
      - name: Run Gitleaks (push full scan)
        if: github.event_name == 'push'
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-push.sarif

      # Upload SARIF to GitHub Security tab so findings surface as code-scanning
      # alerts. continue-on-error so a clean scan (no SARIF file) doesn't fail.
      - name: Upload SARIF to GitHub Security tab (PR)
        if: github.event_name == 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-pr.sarif
          category: gitleaks-pr
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab (push)
        if: github.event_name == 'push' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-push.sarif
          category: gitleaks-push
        continue-on-error: true
