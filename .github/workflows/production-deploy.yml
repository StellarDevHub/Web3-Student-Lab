name: Production Deployment & Canary Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target deployment environment'
        required: true
        default: 'production'
      skip_canary:
        description: 'Skip canary verification (Emergency only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    outputs:
      previous_sha: ${{ steps.record_state.outputs.previous_sha }}
      deployed_sha: ${{ steps.record_state.outputs.deployed_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Record Pre-deployment State & Target SHA
        id: record_state
        run: |
          PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "HEAD~1")
          CURR_SHA=$(git rev-parse HEAD)
          echo "previous_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$CURR_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $CURR_SHA (Previous: $PREV_SHA)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Build Backend & Assets
        working-directory: ./backend
        run: npm run build

      - name: Execute Production Deploy
        id: deploy_step
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' '${{ secrets.KUBECONFIG_DATA }}' | base64 -d > "$HOME/.kube/config"
          kubectl apply -f k8s/canary-ingress.yaml
          kubectl set image deployment/backend-canary backend="${{ secrets.PRODUCTION_IMAGE }}" -n production
          kubectl rollout status deployment/backend-canary -n production --timeout=5m

  canary_verification:
    name: Canary Post-Deploy Synthetic Verification
    needs: deploy_production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Configure Kubernetes
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' '${{ secrets.KUBECONFIG_DATA }}' | base64 -d > "$HOME/.kube/config"

      - name: Run Canary Verification And Traffic Progression
        id: canary_smoke
        timeout-minutes: 25
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
        run: |
          chmod +x ./scripts/canary-verifier.sh
          ./scripts/canary-verifier.sh

      - name: Generate typed OpenAPI client
        working-directory: ./backend
        run: npm run openapi:generate-client

      - name: Compile generated OpenAPI client
        working-directory: ./backend
        run: npx tsc --noEmit --strict --target ES2022 --lib ES2022,DOM generated/openapi-client.ts

      - name: Publish typed OpenAPI client artifact
        uses: actions/upload-artifact@v4
        with:
          name: web3-student-lab-openapi-client
          path: backend/generated/openapi-client.ts
          if-no-files-found: error
          retention-days: 90

  automated_rollback:
    name: Automated Rollback on Canary Failure
    needs: [deploy_production, canary_verification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Canary Health Status
        id: check_status
        run: |
          if [ "${{ needs.canary_verification.result }}" != "success" ] && [ "${{ needs.deploy_production.result }}" == "success" ]; then
            echo "TRIGGER_ROLLBACK=true" >> $GITHUB_ENV
            echo "🚨 Canary verification failed! Proceeding with automated rollback..."
          else
            echo "TRIGGER_ROLLBACK=false" >> $GITHUB_ENV
            echo "✅ Canary verification passed. System healthy, no rollback required."
          fi

      - name: Checkout Code
        if: env.TRIGGER_ROLLBACK == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy_production.outputs.previous_sha }}

      - name: Trigger Automated Production Rollback
        if: env.TRIGGER_ROLLBACK == 'true'
        id: rollback
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          echo "========================================================"
          echo "🚨 CRITICAL: Canary verification check failed!"
          echo "Initiating automated rollback to previous stable commit: ${{ needs.deploy_production.outputs.previous_sha }}"
          echo "========================================================"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          kubectl annotate ingress backend-production -n production \
            nginx.ingress.kubernetes.io/canary-weight="0" --overwrite
          kubectl rollout undo deployment/backend-canary -n production || true
          kubectl rollout status deployment/backend-blue -n production --timeout=5m
          echo "Rollback successfully executed."

      - name: Send Rollback Incident Alert to Discord / Slack
        if: env.TRIGGER_ROLLBACK == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          ALERT_MSG="🚨 **CRITICAL: Production Canary Smoke Test Failed!** Automated rollback triggered to commit \`${{ needs.deploy_production.outputs.previous_sha }}\`. Investigation required immediately."
          
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" -X POST \
              -d "{\"content\": \"$ALERT_MSG\"}" \
              "$DISCORD_WEBHOOK" || true
          fi
          
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" -X POST \
              -d "{\"text\": \"$ALERT_MSG\"}" \
              "$SLACK_WEBHOOK" || true
          fi


  deployment_notifications:
    name: Post-Deployment Alerts & Notifications
    needs: [deploy_production, canary_verification]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Deployment Success Alert (Discord / Slack)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SUCCESS_MSG="🚀 **Production Deployment & Canary Verification Succeeded!** Commit \`${{ needs.deploy_production.outputs.deployed_sha }}\` verified healthy across Auth, Database, RPC, and WASM runtime."
          
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" -X POST \
              -d "{\"content\": \"$SUCCESS_MSG\"}" \
              "$DISCORD_WEBHOOK" || true
          fi

          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" -X POST \
              -d "{\"text\": \"$SUCCESS_MSG\"}" \
              "$SLACK_WEBHOOK" || true
          fi
