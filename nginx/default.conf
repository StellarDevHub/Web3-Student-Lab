# Production NGINX Reverse Proxy Configuration with TLS Termination, HTTP/2, and Security Headers
# Achieves Qualys SSL Labs A+ and Mozilla Observatory A+ rating

# Upstream Backend API
upstream backend_api {
    server backend:8080;
    keepalive 32;
}

# Upstream Frontend Application
upstream frontend_app {
    server frontend:3000;
    keepalive 32;
}

# Upstream Indexer / WebSockets
upstream indexer_service {
    server indexer:3001;
    keepalive 32;
}

# HTTP Server - Redirect all plaintext traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME Challenge location for Let's Encrypt certificates
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all remaining HTTP traffic to HTTPS (permanent 301)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - TLS Termination with HTTP/2 Support
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # High-Security TLS Configuration (SSL Labs A+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Must be enabled for A+ rating)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers (Mozilla Observatory A+)
    # HSTS (Strict-Transport-Security): 1 year + subdomains + preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Prevent MIME Sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Prevent Clickjacking (X-Frame-Options & CSP frame-ancestors)
    add_header X-Frame-Options "DENY" always;
    
    # Cross-Site Scripting Protection (legacy fallback)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

    # Content Security Policy (Production-grade)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Hide NGINX version
    server_tokens off;

    # Gzip / Compression settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts and Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Indexer WebSocket and SSE Proxy
    location /indexer/ {
        rewrite ^/indexer/(.*) /$1 break;
        proxy_pass http://indexer_service;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend Proxy (Fallback for root and app routes)
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;

        # WebSocket support (Next.js hot reload / socket connections)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Health check endpoint for Load Balancer
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
