[databases]
; Primary write database
main_db = host=primary-db.example.com port=5432 dbname=web3_student_lab
; Read replica 1 (US region)
read_replica_us = host=read-replica-us.example.com port=5432 dbname=web3_student_lab
; Read replica 2 (EU region)
read_replica_eu = host=read-replica-eu.example.com port=5432 dbname=web3_student_lab
; Read replica 3 (APAC region)
read_replica_apac = host=read-replica-apac.example.com port=5432 dbname=web3_student_lab

[pgbouncer]
; Connection pooling
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 200
max_user_connections = 100
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
client_login_timeout = 60
autodb_idle_timeout = 3600
dns_max_ttl = 900
dns_nxdomain_ttl = 15

; Connection pooling behavior
statement_timeout = 0
server_check_query = select 1
server_check_delay = 10
application_name_add_host = 0
ignore_startup_parameters = extra_float_digits

[users]
; Credentials (should be loaded from env)
web3_user = pool_mode=transaction
