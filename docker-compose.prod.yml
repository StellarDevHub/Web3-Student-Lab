# Production-like / high-availability override — Sentinel + Cluster enabled.
# Usage (from repo root):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Use this when you need to exercise Redis Sentinel failover or Cluster
# topology alongside PostgreSQL. The base docker-compose.yml already
# defines these services; this file wires the backend to HA Redis modes.

services:
  # PostgreSQL production tuning: non-blocking autovacuum, >250ms slow query
  # logging, and deadlock/lock-wait monitoring (BE-080).
  db:
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - web3-network

  # PgBouncer transaction-mode connection pooler (BE-080).
  # Maintains stable pooled connections under 2,000+ concurrent clients.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    container_name: web3-student-lab-pgbouncer
    restart: always
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-web3-student-lab}
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=2500
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=20
      - RESERVE_POOL_TIMEOUT=3
      - MAX_DB_CONNECTIONS=100
      - SERVER_IDLE_TIMEOUT=300
      - SERVER_LIFETIME=3600
      - QUERY_WAIT_TIMEOUT=120
      - SERVER_RESET_QUERY=DISCARD ALL
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,options
      - ADMIN_USERS=${POSTGRES_USER:-postgres}
      - STATS_USERS=${POSTGRES_USER:-postgres}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web3-network

  backend:
    environment:
      # Route application queries through PgBouncer transaction pool (BE-080)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:6432/${POSTGRES_DB:-web3-student-lab}?schema=public&pgbouncer=true&connection_limit=50
      # Direct PostgreSQL URL for Prisma schema migrations (bypasses transaction pooling)
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-web3-student-lab}?schema=public
      # Switch to sentinel or cluster as needed for HA testing:
      #   REDIS_MODE=sentinel  |  REDIS_MODE=cluster  |  REDIS_MODE=standalone
      - REDIS_MODE=${REDIS_MODE:-sentinel}
      - REDIS_SENTINELS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - REDIS_SENTINEL_NAME=mymaster
      - REDIS_CLUSTER_NODES=redis-cluster-1:6381,redis-cluster-2:6382,redis-cluster-3:6383
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: web3-student-lab-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      indexer:
        condition: service_healthy
    networks:
      - web3-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  certs_data:
