version: '3.9'

services:
  # Primary PostgreSQL database (us-east)
  postgres-primary:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: web3_student_lab
      POSTGRES_USER: web3_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c wal_level=replica -c max_wal_senders=3 -c max_replication_slots=3"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./postgres-wal-archive.sh:/etc/postgresql/wal_archive.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web3_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Read Replica 1 (us-east-1)
  postgres-replica-us:
    image: postgres:15-alpine
    environment:
      POSTGRES_REPLICATION_MODE: slave
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    command: |
      sh -c 'until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -v -P -W -R; do
        sleep 1;
      done && postgres'
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - postgres_replica_us_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # Read Replica 2 (eu-west-1)
  postgres-replica-eu:
    image: postgres:15-alpine
    environment:
      POSTGRES_REPLICATION_MODE: slave
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    command: |
      sh -c 'until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -v -P -W -R; do
        sleep 1;
      done && postgres'
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - postgres_replica_eu_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  # PgBouncer connection pooler
  pgbouncer:
    image: pgbouncer:latest
    environment:
      DATABASES_HOST: postgres-primary
      DATABASES_PORT: 5432
      DATABASES_USER: web3_user
      DATABASES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./userlist.txt:/etc/pgbouncer/userlist.txt
    ports:
      - "6432:6432"
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD", "psql", "-h", "localhost", "-p", "6432", "-U", "web3_user", "-d", "web3_student_lab", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for SSE and caching
  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Sentinel for HA
  redis-sentinel:
    image: redis:7-alpine
    command: redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf
      - sentinel_data:/data
    ports:
      - "26379:26379"
    depends_on:
      - redis

volumes:
  postgres_primary_data:
  postgres_replica_us_data:
  postgres_replica_eu_data:
  redis_data:
  sentinel_data:

networks:
  default:
    name: web3-lab-network
