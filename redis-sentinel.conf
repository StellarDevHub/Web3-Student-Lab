# Redis Sentinel Configuration for High Availability
# This configuration file sets up Sentinel for monitoring and failover

# Port on which Sentinel listens
port 26379

# Log level - one of: debug, verbose, notice, warning
loglevel notice

# Docker service names are hostnames, which Sentinel only accepts when
# hostname resolution is enabled (must precede "sentinel monitor").
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitor the "redis" master; 2 of the 3 sentinels must agree it is down.
sentinel monitor mymaster redis 6379 2

# Failover budget (BE-004): detect a dead master after 1s and promote the
# replica well inside 3s. Clients use failoverDetector to switch immediately.
sentinel down-after-milliseconds mymaster 1000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 3000

# By default Sentinel includes no other configuration files, but you can include
# external config files with this directive
