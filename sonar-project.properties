# SonarQube & SonarCloud Configuration

sonar.projectKey=StellarDevHub_Web3-Student-Lab
sonar.projectName=Web3-Student-Lab
sonar.projectVersion=1.0.0

# Language & Source Configurations
sonar.sources=frontend/src,backend/src,contracts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/target/**,**/coverage/**,**/e2e/**

# Quality Gate Threshold Enforcements
sonar.qualitygate.wait=true
sonar.security.hotspots.maxAllowed=0
sonar.duplicated.lines.density.maxAllowed=3.0

# Code Coverage & Analysis Properties
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
